version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: snns_apartment_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: snns_apartment_db
      MYSQL_USER: snns_user
      MYSQL_PASSWORD: snns_password
    ports:
      - "3306:3306"
    volumes:
      - snns_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snns_apartment_backend
    restart: always
    depends_on:
      mysql-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/snns_apartment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: snns_user
      SPRING_DATASOURCE_PASSWORD: snns_password
      FILE_UPLOAD_DIR: /app/uploads
    volumes:
      - snns_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: snns_apartment_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  snns_mysql_data:
  snns_uploads:
